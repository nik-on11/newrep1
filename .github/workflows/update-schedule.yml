name: Update schedule

on:
  schedule:
    - cron: "0 21 * * 6"   # суббота 21:00 UTC = воскресенье 00:00 по Минску
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install requests beautifulsoup4

      - name: Run parser
        run: |
          if [ -f tools/parser.py ]; then DIR=tools
          elif [ -f parser.py ]; then DIR=.
          else echo "parser.py not found"; ls -la; exit 1
          fi
          [ "$DIR" = "." ] || cp schedules.json "$DIR/schedules.json" 2>/dev/null || true
          python "$DIR/parser.py"
          [ "$DIR" = "." ] || cp "$DIR/schedules.json" schedules.json

      - name: Commit only if changed
        run: |
          git config user.name "schedule-bot"
          git config user.email "actions@github.com"
          git add schedules.json
          git diff --cached --quiet || (git commit -m "Update schedule" && git push)
