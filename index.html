<!DOCTYPE html>
<html lang="ru" data-theme="amber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание МГЭИ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#120d08">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Расписание">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root[data-theme=amber]{--bg:#120d08;--card:#1d150e;--accent:#f59e0b;--accent2:#34d399;--text:#fff8f0;--hint:#a18a78;--border:rgba(245,158,11,.14);--soft:rgba(245,158,11,.13);--soft2:rgba(52,211,153,.13)}
:root[data-theme=emerald]{--bg:#091712;--card:#10241d;--accent:#10b981;--accent2:#fbbf24;--text:#ecfdf5;--hint:#7fc4a4;--border:rgba(16,185,129,.16);--soft:rgba(16,185,129,.13);--soft2:rgba(251,191,36,.13)}
:root[data-theme=ocean]{--bg:#0b1329;--card:#131f3d;--accent:#38bdf8;--accent2:#60a5fa;--text:#eff6ff;--hint:#8fb4e6;--border:rgba(59,130,246,.18);--soft:rgba(56,189,248,.13);--soft2:rgba(96,165,250,.14)}
:root[data-theme=amethyst]{--bg:#130b1f;--card:#1f1430;--accent:#a78bfa;--accent2:#f472b6;--text:#f5f0ff;--hint:#a595c9;--border:rgba(167,139,250,.18);--soft:rgba(167,139,250,.13);--soft2:rgba(244,114,182,.13)}
:root[data-theme=space]{--bg:#070b16;--card:#0f1730;--accent:#818cf8;--accent2:#22d3ee;--text:#eef2ff;--hint:#8e9bc4;--border:rgba(129,140,248,.18);--soft:rgba(129,140,248,.13);--soft2:rgba(34,211,238,.13)}
:root[data-theme=light]{--bg:#f4f6fb;--card:#fff;--accent:#2563eb;--accent2:#059669;--text:#111827;--hint:#6b7280;--border:rgba(0,0,0,.08);--soft:rgba(37,99,235,.09);--soft2:rgba(5,150,105,.1)}

:root[data-theme=oled]{--bg:#000;--card:#121212;--accent:#00ff66;--accent2:#00e5ff;--text:#e8fff0;--hint:#6f8f7c;--border:#222;--soft:rgba(0,255,102,.1);--soft2:rgba(0,229,255,.1)}
:root[data-theme=neon]{--bg:#090914;--card:rgba(255,255,255,.06);--accent:#ff2a85;--accent2:#3b82f6;--text:#f5f0ff;--hint:#a99ed6;--border:rgba(255,42,133,.28);--soft:rgba(255,42,133,.15);--soft2:rgba(59,130,246,.18)}
:root[data-theme=matcha]{--bg:#1e221e;--card:#2c352d;--accent:#8a9a86;--accent2:#c4d3a4;--text:#efe9d6;--hint:#9aa595;--border:rgba(138,154,134,.25);--soft:rgba(138,154,134,.16);--soft2:rgba(196,211,164,.14)}
:root[data-theme=matcha-light]{--bg:#f4f6f0;--card:#e3eadb;--accent:#5f7a5a;--accent2:#7a9a4a;--text:#25301f;--hint:#68756a;--border:rgba(95,122,90,.25);--soft:rgba(95,122,90,.12);--soft2:rgba(122,154,74,.14);--shade:255,255,255}
:root[data-theme=titanium]{--bg:#0f1115;--card:#1b1e25;--accent:#f59e0b;--accent2:#ffb454;--text:#e6e9ee;--hint:#8a919c;--border:rgba(255,255,255,.09);--soft:rgba(245,158,11,.13);--soft2:rgba(255,180,84,.12)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--text);font:.9375rem/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Display",Roboto,"Segoe UI",sans-serif;
  background:radial-gradient(120% 50% at 50% -10%,var(--soft),transparent 70%),var(--bg);
  padding:max(env(safe-area-inset-top),10px) 14px max(env(safe-area-inset-bottom),20px)}
button,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.logo{width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:1.3125rem;background:var(--card);border:1px solid var(--border);border-radius:13px}
.who{flex:1;min-width:0}.who b{display:block;font-size:1.0625rem}
.who span{display:block;color:var(--hint);font-size:0.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 12px;color:var(--accent);font-weight:700;cursor:pointer}
.week{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:8px;margin-bottom:12px}
.week .ib{padding:10px 16px;font-size:1.125rem}
.wi{flex:1;text-align:center}.wi small{display:block;color:var(--accent);font-size:0.625rem;font-weight:800;letter-spacing:1px;text-transform:uppercase}.wi b{font-size:0.9375rem}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:14px}
.days::-webkit-scrollbar{display:none}
.day{flex:1 0 62px;text-align:center;padding:10px 4px;background:var(--card);border:1px solid var(--border);border-radius:14px;cursor:pointer}
.day b{display:block;color:var(--accent);font-size:0.875rem}.day i{display:block;font-style:normal;color:var(--hint);font-size:0.6875rem;margin:2px 0 5px}
.day em{font-style:normal;font-size:0.625rem;font-weight:700;color:var(--hint)}
.day.today{border-color:var(--accent2)}
.day.on{background:var(--soft);border-color:var(--accent);box-shadow:0 0 14px var(--soft)}
.les{position:relative;display:flex;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px 14px 14px 18px;margin-bottom:10px;overflow:hidden}
.les::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc,var(--accent2))}
.les.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 22px var(--soft)}
.t{min-width:54px;font-size:1rem;font-weight:800;color:var(--tc,var(--accent2))}.t small{display:block;font-size:0.8125rem;font-weight:600;color:var(--hint)}
.b{flex:1;min-width:0}.ti{font-weight:700;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{font-size:0.75rem;font-weight:600;padding:4px 9px;border-radius:9px;background:var(--soft);color:var(--accent)}.tag.g{background:var(--soft2);color:var(--accent2);background:color-mix(in srgb,var(--tc,var(--accent2)) 16%,transparent);color:var(--tc,var(--accent2))}
.tr{font-size:0.8125rem;color:var(--hint)}
.empty{text-align:center;padding:38px 16px;color:var(--hint);background:var(--card);border:1px dashed var(--border);border-radius:18px}
.dh{margin:0 2px 10px}.dh small{display:block;color:var(--accent2);font-size:0.625rem;font-weight:800;letter-spacing:1px;text-transform:uppercase}.dh b{font-size:1.0625rem}
.note{margin:0 0 12px;padding:9px 12px;border-radius:12px;background:var(--soft);color:var(--hint);font-size:0.75rem}
.ib.off{opacity:.45}
.ib:disabled{opacity:.3;cursor:default}
.tm{margin-bottom:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--border)}
.tm.live{border-color:var(--accent2);box-shadow:0 0 18px var(--soft2)}
.tm-top{display:flex;flex-direction:column;gap:2px}
.tm-l{font-size:0.8125rem;font-weight:700;color:var(--hint)}
.tm-v{font-size:1.5rem;font-weight:800;color:var(--accent2);font-variant-numeric:tabular-nums}
.tm-bar{height:6px;margin-top:9px;border-radius:6px;background:var(--soft);overflow:hidden}
.tm-bar i{display:block;height:100%;width:0;border-radius:6px;background:var(--accent2);transition:width 1s linear}
.tm-s{margin-top:6px;font-size:0.75rem;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-block;margin-bottom:6px;padding:3px 9px;border-radius:9px;font-size:0.6875rem;font-weight:800}
.st.now{background:var(--accent);color:var(--bg)}
.st.soon{background:var(--soft);color:var(--accent)}
.st.past,.st.fut{padding-left:0;color:var(--hint);font-weight:700}
.les.past{opacity:.45}
.les.soon{border-color:var(--accent);border-style:dashed}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 2px 10px;font-size:0.75rem;color:var(--hint)}
.lg span::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:var(--tc)}
#wp{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center}
#wp::after{content:"";position:absolute;inset:0;background:rgba(var(--shade,0,0,0),var(--dim,.45))}
:root[data-theme=light]{--shade:255,255,255}
.wall .les,.wall .day,.wall .week,.wall .tm,.wall .empty,.wall .ib,.wall .logo{background:var(--card);background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(6px)}
.wall .day.on{background:var(--soft)}
.wbtn{margin:0 8px 8px 0;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--accent);font-weight:700;cursor:pointer}
.wl{margin:6px 0 2px;font-size:0.75rem;color:var(--hint)}
input[type=range]{width:100%;accent-color:var(--accent)}
/* --- особенности отдельных тем --- */
:where(:root[data-theme=oled]) body{background:#000;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}
:where(:root[data-theme=oled]) :is(.les,.day,.week,.tm,.empty,.ib,.logo){border-radius:8px}
:where(:root[data-theme=neon]) body{background:radial-gradient(90% 45% at 12% -5%,rgba(255,42,133,.24),transparent 60%),radial-gradient(80% 50% at 92% 8%,rgba(59,130,246,.22),transparent 60%),#090914}
:where(:root[data-theme=neon]) :is(.les,.day,.week,.tm,.empty,.note,.ib,.logo){backdrop-filter:blur(14px);box-shadow:0 0 22px rgba(255,42,133,.1),inset 0 1px 0 rgba(255,255,255,.07)}
:where(:root[data-theme=oled],:root[data-theme=neon]) :is(.t,.tm-v){text-shadow:0 0 10px currentColor}
:where(:root[data-theme=matcha],:root[data-theme=matcha-light]) :is(.les,.day,.week,.tm,.empty){border-radius:22px}
:where(:root[data-theme=titanium]) :is(.les,.day,.week,.tm,.empty){background:linear-gradient(160deg,#252a33,#171a20);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.45)}
.dots{display:flex;justify-content:center;gap:4px;margin-top:6px}
.dots i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(128,128,128,.5)}
.modal{position:fixed;inset:0;z-index:9;display:none;align-items:flex-end;background:rgba(0,0,0,.7);backdrop-filter:blur(8px)}
.modal.open{display:flex}
.sheet{width:100%;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;border-top:1px solid var(--border);padding:18px 16px max(env(safe-area-inset-bottom),28px)}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.mh h2{margin:0;font-size:1.125rem;color:var(--accent)}
.hint{color:var(--hint);font-size:0.75rem;margin:0 0 14px}
.fld{margin-bottom:14px}.fld label{display:block;margin-bottom:6px;font-size:0.625rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--accent)}
select{width:100%;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:0.9375rem;outline:none}
.seg{display:flex;gap:6px;padding:4px;background:var(--card);border:1px solid var(--border);border-radius:13px}
.seg button{flex:1;padding:10px 4px;border:0;border-radius:10px;background:none;color:var(--hint);font-weight:700;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--bg)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.th{padding:12px 8px;text-align:center;background:var(--card);border:2px solid var(--border);border-radius:14px;font-weight:700;cursor:pointer}
.th.on{border-color:var(--accent)}

/* ===== Редизайн: чище, компактнее, доступнее ===== */
html{font-size:100%}
[hidden]{display:none!important}
body{max-width:640px;margin:0 auto}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr,.skip:not(:focus){position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{left:8px;top:8px;z-index:20;padding:10px 14px;border-radius:10px;background:var(--accent);color:var(--bg);font-weight:700}
header{margin-bottom:10px}
.logo{width:38px;height:38px;border-radius:12px;font-size:1.1rem}
.who h1{margin:0;font-size:1.0625rem}
.ib{min-width:44px;min-height:44px;display:inline-grid;place-items:center}
.tm{padding:10px 14px;margin-bottom:10px}
.tm-top{flex-direction:row;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px}
.tm-v{font-size:1.25rem}
.week{background:none;border:0;padding:0;margin-bottom:8px}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;overflow:visible;margin-bottom:12px}
.day{min-height:64px;padding:8px 2px;border-radius:14px}
.day i{font-size:1.125rem;font-weight:800;color:var(--text);margin:1px 0}
.day em{display:block;height:10px;font-size:.5rem;letter-spacing:1px;color:var(--accent)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dh .ib{min-height:40px;padding:6px 14px;font-size:.8125rem}
.les{padding:12px 14px 12px 16px;gap:12px;border-radius:16px;margin-bottom:8px}
.t{min-width:48px}
.ti{margin-bottom:6px;line-height:1.3}
dialog{width:100%;max-width:640px;margin:auto auto 0;padding:0;border:0;background:none;color:var(--text);overflow:visible}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(6px)}
.th,.wbtn,.seg button,select{min-height:44px}
.th{font:inherit;color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="skip" href="#list">К расписанию</a>
<div id="wp" hidden></div>
<header>
  <div class="logo" aria-hidden="true">🌿</div>
  <div class="who"><h1>МГЭИ · расписание</h1><span id="sub">загрузка…</span></div>
  <button class="ib" id="gear" aria-label="Настройки: группа, тема, обои" aria-haspopup="dialog">⚙️</button>
</header>
<div class="tm" id="tm" role="timer" aria-live="off" hidden>
  <div class="tm-top"><span class="tm-l" id="tmL"></span><span class="tm-v" id="tmV"></span></div>
  <div class="tm-bar" aria-hidden="true"><i id="tmB"></i></div>
  <div class="tm-s" id="tmS"></div>
</div>
<div class="sr" id="live" aria-live="polite"></div>
<div class="note" id="offline" role="status" hidden></div>
<nav aria-label="Выбор недели и дня">
  <div class="week">
    <button class="ib" id="prev" aria-label="Предыдущая неделя">‹</button>
    <div class="wi"><small id="wl"></small><b id="wd"></b></div>
    <button class="ib" id="next" aria-label="Следующая неделя">›</button>
  </div>
  <div class="days" id="days" role="tablist" aria-label="Дни недели"></div>
</nav>
<div class="dh"><div><small id="dl"></small><b id="dd"></b></div><button class="ib" id="today" hidden>К сегодня</button></div>
<div class="note" id="note" hidden>ℹ️ В данных нет разбивки по неделям — на любой неделе показано одно и то же расписание</div>
<main id="list" tabindex="-1"></main>

<dialog id="modal" aria-labelledby="mt">
  <div class="sheet">
    <div class="mh"><h2 id="mt">Настройки</h2><button class="ib" id="close" aria-label="Закрыть">✕</button></div>
    <p class="hint">Сохраняются автоматически</p>
    <div id="fields"></div>
    <div class="fld"><label id="subl">Подгруппа (лабораторные)</label><div class="seg" id="seg" role="group" aria-labelledby="subl"></div></div>
    <div class="fld"><label id="fszl">Размер текста</label><div class="seg" id="fsz" role="group" aria-labelledby="fszl"></div></div>
    <div class="fld" id="appbox" hidden><label>Приложение</label><div id="appbtns"></div></div>
    <div class="fld"><label>Обои</label><div id="wallbox"></div><input type="file" id="wallfile" accept="image/*" hidden></div>
    <div class="fld"><label id="thl">Тема оформления</label><div class="themes" id="themes" role="group" aria-labelledby="thl"></div></div>
  </div>
</dialog>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const $ = id => document.getElementById(id);
  const h = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const LS = {
    get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const cmp = (a, b) => String(a).localeCompare(String(b), "ru", { numeric: true });

  const DAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
  const FULL = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"];
  const THEMES = [["auto", "✨ Авто"], ["oled", "⚫ OLED Midnight"], ["neon", "🌌 Cyberpunk Neon"], ["matcha", "🍃 Soft Matcha"],
                  ["matcha-light", "🍵 Matcha Light"], ["titanium", "⚡ Titanium Cyber"], ["amber", "🔥 Янтарь"],
                  ["emerald", "🌿 Изумруд"], ["ocean", "🌊 Океан"], ["amethyst", "💎 Аметист"],
                  ["space", "🪐 Космос"], ["light", "☀️ Светлая"]];
  const SWATCH = {   // фон / акцент / второй акцент — маленькие кружки на кнопке темы
    auto: ["#120d08", "#f59e0b", "#f4f6fb"], oled: ["#000000", "#00ff66", "#00e5ff"], neon: ["#090914", "#ff2a85", "#3b82f6"],
    matcha: ["#1e221e", "#8a9a86", "#c4d3a4"], "matcha-light": ["#f4f6f0", "#5f7a5a", "#7a9a4a"],
    titanium: ["#0f1115", "#f59e0b", "#ffb454"], amber: ["#120d08", "#f59e0b", "#34d399"],
    emerald: ["#091712", "#10b981", "#fbbf24"], ocean: ["#0b1329", "#38bdf8", "#60a5fa"],
    amethyst: ["#130b1f", "#a78bfa", "#f472b6"], space: ["#070b16", "#818cf8", "#22d3ee"],
    light: ["#f4f6fb", "#2563eb", "#059669"] };
  const TYPES = { "лек": ["📖", "Лекция", "#3b82f6"], "лаб": ["🧪", "Лаб. работа", "#22c55e"],
                  "пр": ["✍️", "Практика", "#a855f7"], "практ": ["✍️", "Практика", "#a855f7"],
                  "сем": ["💬", "Семинар", "#f97316"], "конс": ["🗨️", "Консультация", "#94a3b8"],
                  "экз": ["📝", "Экзамен", "#ef4444"], "зач": ["✅", "Зачёт", "#ec4899"] };

  const S = {};
  ["faculty", "department", "course", "group", "sub", "theme"].forEach(k => S[k] = LS.get(k, k === "sub" ? "all" : k === "theme" ? "auto" : ""));

  let DATA = {}, ALL = [], OPTS = {}, weekOffset = 0, DATA_AT = null;
  const minsk = () => { const d = new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Minsk" })); return isNaN(d) ? new Date() : d; };
  const today = minsk(), todayIdx = (today.getDay() + 6) % 7;
  let day = todayIdx;

  const save = () => Object.keys(S).forEach(k => LS.set(k, S[k]));

  const LEVELS = [["faculty", "Факультет"], ["department", "Форма обучения"], ["course", "Курс"], ["group", "Группа"]];
  // Каскад как на сайте: форма обучения зависит от факультета, курс — от формы, группа — от курса
  function cascade() {
    let pool = ALL;
    LEVELS.forEach(([k]) => {
      const opts = [...new Set(pool.map(g => g[k]))].sort(cmp);
      if (!opts.includes(S[k])) S[k] = opts[0];
      OPTS[k] = opts;
      pool = pool.filter(g => g[k] === S[k]);
    });
    save();
  }

  // Недели: в данных они лежат под ключом «понедельник недели» (YYYY-MM-DD)
  const pad = n => String(n).padStart(2, "0");
  const keyFor = off => { const d = weekDates(off)[0]; return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const hasWeek = off => { const e = DATA[S.group] || {}; return e.weeks ? !!e.weeks[keyFor(off)] : true; };
  const weekOf = () => { const e = DATA[S.group] || {}; return e.weeks ? e.weeks[keyFor(weekOffset)] : e; };   // старый формат — без недель

  function applyTheme() {
    document.documentElement.dataset.theme = S.theme === "auto" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "amber") : S.theme;
    try {
      const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
      const mt = document.querySelector('meta[name=theme-color]'); if (mt) mt.content = bg;   // цвет системной строки в установленном приложении
    } catch (e) {}
  }

  function parse(l) {
    let s = (l.subject || "").trim(), sub = null, type = null;
    const m = s.match(/(\d)\s*п\/гр\.?/i);
    if (m) { sub = m[1]; s = s.replace(m[0], ""); }
    const t = s.match(/^(лаб|лек|пр|практ|сем|конс|экз|зач)\.\s*(?:зан\.\s*)?/i);
    if (t) { type = TYPES[t[1].toLowerCase()]; s = s.slice(t[0].length); }
    s = s.replace(/\(\s*\)/g, "").replace(/\s+/g, " ").replace(/^[\s,;.\-–]+|[\s,;.\-–]+$/g, "");
    return { ...l, title: s || l.subject || "—", sub, type };
  }

  const lessonsOf = i => ((weekOf() || {})[i] || []).map(parse)
    .filter(l => !(l.sub && S.sub !== "all" && l.sub !== S.sub));

  const weekDates = off => {
    const mon = new Date(today.getFullYear(), today.getMonth(), today.getDate() - todayIdx + off * 7);
    return DAYS.map((_, i) => new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i));
  };
  const fmt = d => String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0");
  const toMin = t => { const m = (t || "").match(/(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };
  const roomText = r => /^(ауд|каб)/i.test(r) ? r : "ауд. " + r;

  function isNow(l) {
    if (weekOffset !== 0 || day !== todayIdx) return false;
    const [a, b] = (l.time || "").split(/\s*[-–—]\s*/), n = minsk(), cur = n.getHours() * 60 + n.getMinutes();
    return toMin(a) !== null && toMin(b) !== null && cur >= toMin(a) && cur <= toMin(b);
  }

  function render() {
    tick();   // пересчитываем таймер при смене группы / подгруппы
    const n = lessonsOf(6).length ? 7 : 6;
    if (day >= n) day = 0;
    const dates = weekDates(weekOffset);

    $("wl").textContent = weekOffset === 0 ? "Текущая неделя" : weekOffset === 1 ? "Следующая неделя"
      : weekOffset === -1 ? "Прошлая неделя" : weekOffset > 0 ? `Через ${weekOffset} нед.` : `${-weekOffset} нед. назад`;
    $("wd").textContent = `${fmt(dates[0])} — ${fmt(dates[n - 1])}.${dates[n - 1].getFullYear()}`;
    $("sub").textContent = [S.group, S.course !== "—" && S.course, S.sub !== "all" && S.sub + " п/гр"].filter(Boolean).join(" · ") || "Выбери группу в ⚙️";

    const days = $("days"); days.replaceChildren();
    for (let i = 0; i < n; i++) {
      const c = lessonsOf(i).length;
      const isRealToday = (weekOffset === 0 && i === todayIdx);
      const d = h("button", "day" + (i === day ? " on" : "") + (weekOffset === 0 && i === todayIdx ? " today" : ""));
      d.type = "button"; d.setAttribute("role", "tab"); d.setAttribute("aria-selected", i === day); d.tabIndex = i === day ? 0 : -1;
      d.setAttribute("aria-label", `${FULL[i]}, ${fmt(dates[i])}: ${c ? c + " " + (c === 1 ? "пара" : c < 5 ? "пары" : "пар") : "занятий нет"}`);
      d.append(h("b", "", DAYS[i]), h("i", "", String(dates[i].getDate())), h("em", "", "●".repeat(Math.min(c, 5))));
      d.onclick = () => { day = i; render(); $("days").children[i].focus(); };
      days.append(d);
    }

    // Заголовок выбранного дня: «Сегодня / Завтра / Вчера / Через N дн.» + дата
    const picked = dates[day], t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const diff = Math.round((picked - t0) / 864e5);
    $("dl").textContent = diff === 0 ? "Сегодня" : diff === 1 ? "Завтра" : diff === -1 ? "Вчера"
      : diff > 0 ? `Через ${diff} дн.` : `${-diff} дн. назад`;
    $("dd").textContent = `${FULL[day]}, ${fmt(picked)}`;
    $("today").hidden = diff === 0;   // кнопка «К сегодня» нужна, только когда открыт другой день
    $("note").hidden = weekOffset === 0 || !!(DATA[S.group] || {}).weeks;   // примечание только для старого формата данных
    $("prev").disabled = !hasWeek(weekOffset - 1);   // нет данных за соседнюю неделю — кнопка неактивна
    $("next").disabled = !hasWeek(weekOffset + 1);

    const list = $("list"); list.replaceChildren();
    const ls = lessonsOf(day);
    if (!ls.length) { list.append(h("div", "empty", weekOf() ? "🎉 В этот день занятий нет" : "Нет данных за эту неделю")); return; }
        const live = weekOffset === 0 && day === todayIdx;   // статусы «Сейчас / Прошло / Будет» — только для сегодняшнего дня
    const nw = minsk(), cur = nw.getHours() * 60 + nw.getMinutes();
    const starts = ls.map(x => span(x)[0]).filter(m => m !== null && m > cur);
    const nextStart = starts.length ? Math.min(...starts) : null;
    ls.forEach(l => {
      const [s, e] = span(l);
      let st = "";
      if (live && s !== null && e !== null) st = cur >= e ? "past" : cur >= s ? "now" : s === nextStart ? "soon" : "fut";
      const card = h("article", "les" + (st ? " " + st : ""));
      if (l.type) card.style.setProperty("--tc", l.type[2]);
      const [a, b] = (l.time || "").split(/\s*[-–—]\s*/);
      const t = h("div", "t", a || "—"); if (b) t.append(h("small", "", b));
      const body = h("div", "b");
      if (st) body.append(h("span", "st " + st, st === "soon" ? `⏳ Скоро начнётся · через ${fmtMin(s - cur)}` : ST[st]));
      body.append(h("div", "ti", l.title));
      const tags = h("div", "tags");
      if (l.type) tags.append(h("span", "tag g", l.type[0] + " " + l.type[1]));
      if (l.room) tags.append(h("span", "tag", "📍 " + roomText(l.room)));
      if (l.sub) tags.append(h("span", "tag", `👥 ${l.sub} п/гр`));
      if (tags.children.length) body.append(tags);
      if (l.teacher) body.append(h("div", "tr", "👤 " + l.teacher));
      card.append(t, body); list.append(card);
    });
  }

  // ---- Таймер «до конца пары» ----
  // Номер пары определяем по времени начала. Если у вас другая сетка звонков — поправьте список.
  const PAIR_STARTS = ["08:30", "10:05", "11:35", "13:25", "14:55", "16:35"];
  const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 15 ? c : k === 1 ? a : k >= 2 && k <= 4 ? b : c; };
  const fmtLeft = s => {
    s = Math.max(0, Math.ceil(s));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    const M = x => `${x} ${plural(x, "минута", "минуты", "минут")}`;
    if (h) return `${h} ${plural(h, "час", "часа", "часов")} ${M(m)}`;
    const sec = `${r} ${plural(r, "секунда", "секунды", "секунд")}`;
    return m ? `${M(m)} ${sec}` : sec;
  };

  function todayLessons() {   // пары СЕГОДНЯШНЕГО дня (независимо от выбранной во вкладках недели)
    const e = DATA[S.group] || {};
    const wk = e.weeks ? e.weeks[keyFor(0)] : e;
    return ((wk || {})[todayIdx] || []).map(parse)
      .filter(l => !(l.sub && S.sub !== "all" && l.sub !== S.sub))
      .map(l => { const [a, b] = (l.time || "").split(/\s*[-–—]\s*/); return { ...l, a: (a || "").trim(), s: toMin(a), e: toMin(b) }; })
      .filter(l => l.s !== null && l.e !== null)
      .sort((x, y) => x.s - y.s);
  }

  let lastLabel = "";
  function tick() {   // вызывается каждую секунду: обновляет только плашку-таймер
    const box = $("tm");
    if (!S.group || !DATA[S.group]) { box.hidden = true; return; }
    const list = todayLessons();
    const n = minsk(), cur = n.getHours() * 3600 + n.getMinutes() * 60 + n.getSeconds();
    if (n.toDateString() !== today.toDateString()) { location.reload(); return; }   // наступил новый день
    const no = l => { const i = PAIR_STARTS.indexOf(l.a.padStart(5, "0")); return i >= 0 ? i + 1 : [...new Set(list.map(x => x.s))].indexOf(l.s) + 1; };
    const info = l => [l.title, l.room].filter(Boolean).join(" · ");

    let label, value = "", pct = 0, sub = "", live = false;
    const going = list.find(l => l.s * 60 <= cur && cur < l.e * 60);
    const next = list.find(l => l.s * 60 > cur);
    if (going) {                                   // идёт пара
      live = true;
      label = `До конца ${no(going)}-й пары`;
      value = fmtLeft(going.e * 60 - cur);
      pct = (cur - going.s * 60) / ((going.e - going.s) * 60);
      sub = info(going);
    } else if (next) {                             // перемена / окно / ещё не началось
      const prev = list.filter(l => l.e * 60 <= cur).sort((x, y) => y.e - x.e)[0];
      label = prev ? `${next.s - prev.e > 30 ? "Окно" : "Перемена"} · до ${no(next)}-й пары` : `До начала ${no(next)}-й пары`;
      value = fmtLeft(next.s * 60 - cur);
      pct = prev ? (cur - prev.e * 60) / ((next.s - prev.e) * 60) : 1 - Math.min(next.s * 60 - cur, 3600) / 3600;
      sub = "Дальше: " + info(next);
    } else {
      label = list.length ? "✅ На сегодня пары закончились" : "🎉 Сегодня занятий нет";
      pct = list.length ? 1 : 0;
    }
    box.hidden = false;
    box.classList.toggle("live", live);
    $("tmL").textContent = label + (value ? ":" : "");
    if (label !== lastLabel) { lastLabel = label; $("live").textContent = label + (value ? ": " + value : ""); }
    $("tmV").textContent = value;
    $("tmS").textContent = sub; $("tmS").hidden = !sub;
    $("tmB").style.width = (Math.min(Math.max(pct, 0), 1) * 100).toFixed(1) + "%";
    box.querySelector(".tm-bar").hidden = !list.length;
  }

  // ---- Статусы пар и обои ----
  const span = l => { const [a, b] = (l.time || "").split(/\s*[-–—]\s*/); return [toMin(a), toMin(b)]; };
  const fmtMin = m => m < 60 ? `${m} мин` : `${Math.floor(m / 60)} ч${m % 60 ? " " + (m % 60) + " мин" : ""}`;
  const ST = { now: "● Сейчас", past: "Прошло", fut: "Будет" };

  let WALL = LS.get("wall", ""), DIM = +LS.get("dim", "45"), FS = LS.get("fs", "100");
  const applyFs = () => { document.documentElement.style.fontSize = FS + "%"; };
  function applyWall() {
    const w = $("wp");
    w.style.backgroundImage = WALL ? `url("${WALL}")` : "";
    w.hidden = !WALL;
    document.body.classList.toggle("wall", !!WALL);
    document.documentElement.style.setProperty("--dim", DIM / 100);
  }
  function loadWall(file) {   // уменьшаем фото, чтобы оно поместилось в память браузера
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      WALL = c.toDataURL("image/jpeg", 0.72);
      LS.set("wall", WALL);
      applyWall(); renderSettings();
    };
    img.src = url;
  }

  function renderSettings() {
    const box = $("fields"); box.replaceChildren();
    LEVELS.forEach(([k, label]) => {
      const o = OPTS[k];
      if (o.length === 1 && o[0] === "—") return;   // уровня нет в данных — не показываем
      const f = h("div", "fld"), s = h("select");
      const lab = h("label", "", label); s.id = "f-" + k; lab.htmlFor = s.id; f.append(lab, s);
      o.forEach(v => s.append(new Option(v, v)));
      s.value = S[k];
      s.onchange = () => { S[k] = s.value; cascade(); renderSettings(); render(); };
      box.append(f);
    });

    const seg = $("seg"); seg.replaceChildren();
    [["all", "Все"], ["1", "1 п/гр"], ["2", "2 п/гр"]].forEach(([v, t]) => {
      const b = h("button", S.sub === v ? "on" : "", t); b.type = "button"; b.setAttribute("aria-pressed", S.sub === v);
      b.onclick = () => { S.sub = v; save(); renderSettings(); render(); };
      seg.append(b);
    });
    const fz = $("fsz"); fz.replaceChildren();
    [["100", "Aa"], ["115", "Aa+"], ["130", "Aa++"]].forEach(([v, t]) => {
      const b = h("button", FS === v ? "on" : "", t); b.type = "button"; b.setAttribute("aria-pressed", FS === v);
      b.onclick = () => { FS = v; LS.set("fs", v); applyFs(); renderSettings(); };
      fz.append(b);
    });
    const ab = $("appbox"), btns = $("appbtns"); btns.replaceChildren();
    const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    ab.hidden = standalone || !(installEvt || ios);
    if (installEvt) {
      const b = h("button", "wbtn", "📲 Установить приложение");
      b.onclick = () => { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; renderSettings(); }); };
      btns.append(b);
    } else if (ios) btns.append(h("div", "wl", "iPhone: кнопка «Поделиться» → «На экран Домой»"));

    const wb = $("wallbox"); wb.replaceChildren();
    const pick = h("button", "wbtn", WALL ? "📷 Сменить фото" : "📷 Выбрать фото из галереи");
    pick.onclick = () => $("wallfile").click();
    wb.append(pick);
    if (WALL) {
      const rm = h("button", "wbtn", "Сбросить");
      rm.onclick = () => { WALL = ""; LS.set("wall", ""); applyWall(); renderSettings(); };
      const rg = h("input"); rg.setAttribute("aria-label", "Затемнение фона"); rg.type = "range"; rg.min = 0; rg.max = 85; rg.value = DIM;
      rg.oninput = () => { DIM = +rg.value; LS.set("dim", DIM); applyWall(); };
      wb.append(rm, h("div", "wl", "Затемнение фона"), rg);
    }
    const th = $("themes"); th.replaceChildren();
    THEMES.forEach(([v, t]) => {
      const b = h("button", "th" + (S.theme === v ? " on" : ""), t); b.type = "button"; b.setAttribute("aria-pressed", S.theme === v);
      const dots = h("div", "dots");
      (SWATCH[v] || []).forEach(c => { const i = h("i"); i.style.background = c; dots.append(i); });
      b.append(dots);
      b.onclick = () => { S.theme = v; save(); applyTheme(); renderSettings(); };
      th.append(b);
    });
  }

  function setData(d) {   // раскладываем данные по спискам: факультет → форма → курс → группа
    DATA = d;
    setData(DATA);
    netState();
  }
  async function refreshData() {   // сервис-воркер скачал новое расписание — обновляем экран без перезагрузки
    const d = await load();
    if (d && Object.keys(d).length) { setData(d); render(); netState(); }
  }
  function netState() {   // плашка «нет сети»
    const el = $("offline");
    el.hidden = navigator.onLine;
    if (navigator.onLine) return;
    const at = DATA_AT ? new Date(DATA_AT) : null;
    el.textContent = "📴 Нет сети — показаны сохранённые данные" + (at && !isNaN(at) ? " от " + at.toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Minsk" }) : "");
  }
  addEventListener("online", netState);
  addEventListener("offline", netState);

  let installEvt = null;   // для кнопки «Установить приложение»
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
  addEventListener("appinstalled", () => { installEvt = null; });

  async function load() {
    for (const u of ["schedules.json"]) {
      try { const r = await fetch(u, { cache: "no-store" }); if (r.ok) { DATA_AT = r.headers.get("date"); return await r.json(); } } catch (e) {}
    }
    return null;
  }

  async function init() {
    applyTheme();
    applyWall(); applyFs();
    matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyTheme);
    $("wallfile").onchange = e => { const f = e.target.files[0]; if (f) loadWall(f); e.target.value = ""; };
    const dlg = $("modal");
    $("gear").onclick = () => { renderSettings(); dlg.showModal ? dlg.showModal() : dlg.setAttribute("open", ""); };
    $("close").onclick = () => dlg.close();
    dlg.onclick = e => { if (e.target === dlg) dlg.close(); };
    $("days").addEventListener("keydown", e => {   // стрелки ← → переключают дни
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      const n = $("days").children.length;
      day = (day + (e.key === "ArrowRight" ? 1 : n - 1)) % n; render(); $("days").children[day].focus(); e.preventDefault();
    });
    
    $("prev").onclick = () => { weekOffset--; render(); };
    $("next").onclick = () => { weekOffset++; render(); };
    $("today").onclick = () => { weekOffset = 0; day = todayIdx; render(); };

    DATA = await load();
    if (!DATA || !Object.keys(DATA).length) {
      $("sub").textContent = "нет данных";
      $("list").append(h("div", "empty", DATA ? "Расписание пока пустое" : "⚠️ Не удалось загрузить расписание"));
      return;
    }

    ALL = Object.entries(DATA).map(([name, e]) => {
      const m = (e && e._meta) || {};   // _meta кладёт parser.py
      return { faculty: m.faculty || "—", department: m.department || "—", course: m.course || "—", group: name };
    });
    cascade();

    if (todayIdx === 6 && !lessonsOf(6).length && hasWeek(1)) { weekOffset = 1; day = 0; }
    render();
    tick();
    let lastMin = -1;
    setInterval(() => {   // каждую секунду — таймер; при смене минуты — перерисовка статусов пар
      tick();
      const m = minsk().getMinutes();
      if (m !== lastMin) { lastMin = m; render(); }
    }, 1000);
  }
  if ("serviceWorker" in navigator) {   // офлайн-режим (PWA)
    navigator.serviceWorker.addEventListener("message", e => { if (e.data === "schedules-updated") refreshData(); });
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
  init();
})();
</script>
</body>
</html>
