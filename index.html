<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание МГЭИ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7f6f2">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Расписание">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f7f6f2;--fg:#1c1d1a;--mut:#6d6f68;--line:#dfddd4;--acc:#2f7a3c;--af:#fff;color-scheme:light}
[data-theme=dark]{--bg:#121412;--fg:#ebece6;--mut:#8c9087;--line:#272b26;--acc:#7cc271;--af:#0d1a0b;color-scheme:dark}
[data-theme=oled]{--bg:#000;--fg:#e8fff0;--mut:#6f8f7c;--line:#222;--acc:#00ff66;--af:#001a0a;color-scheme:dark}
[data-theme=neon]{--bg:#090914;--fg:#f5f0ff;--mut:#a99ed6;--line:rgba(255,42,133,.28);--acc:#ff2a85;--af:#fff;color-scheme:dark}
[data-theme=matcha]{--bg:#1e221e;--fg:#efe9d6;--mut:#9aa595;--line:rgba(138,154,134,.25);--acc:#8a9a86;--af:#1e221e;color-scheme:dark}
[data-theme=matchal]{--bg:#f4f6f0;--fg:#25301f;--mut:#68756a;--line:rgba(95,122,90,.25);--acc:#5f7a5a;--af:#fff}
[data-theme=titan]{--bg:#0f1115;--fg:#e6e9ee;--mut:#8a919c;--line:rgba(255,255,255,.1);--acc:#f59e0b;--af:#1a1100;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
[data-theme=oled] body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
[data-theme=neon] body{background:radial-gradient(90% 40% at 10% -5%,rgba(255,42,133,.22),transparent 60%),radial-gradient(80% 45% at 95% 5%,rgba(59,130,246,.2),transparent 60%),var(--bg)}
button,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#wp{position:fixed;inset:0;z-index:-1;background:center/cover}
#wp::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--dim,.55)}
.wall .page{background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(10px)}
.page{max-width:560px;margin:0 auto;min-height:100vh;padding:max(env(safe-area-inset-top),8px) 16px max(env(safe-area-inset-bottom),24px)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 12px}
.grp{min-height:44px}
.grp b{display:block;font-size:1.375rem;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.grp b::after{content:"▾";margin-left:6px;font-size:.65em;color:var(--mut)}
.grp span{font-size:.8125rem;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{min-height:40px;padding:0 13px;font-size:.8125rem;color:var(--mut)}
.seg [aria-pressed=true]{background:var(--fg);color:var(--bg)}

.st{padding:10px 0 12px;border-top:1px solid var(--line)}
.st-r{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-size:.875rem}
.st-r b{font-weight:700;color:var(--acc)}
.st-bar{height:3px;margin-top:8px;border-radius:2px;background:var(--line);overflow:hidden}
.st-bar i{display:block;height:100%;width:0;background:var(--acc)}
.nt{margin:0;padding:8px 0;border-top:1px solid var(--line);font-size:.8125rem;color:var(--mut)}

.wk{display:flex;align-items:center;border-top:1px solid var(--line);padding:4px 0}
.wk .ar{width:44px;height:44px;text-align:center;font-size:1.5rem;color:var(--mut)}
.wk .ar:disabled{opacity:.25;cursor:default}
.wk .c{flex:1;text-align:center;line-height:1.25;min-height:44px}
.wk .c b{display:block;font-size:.9375rem}
.wk .c span{font-size:.75rem;color:var(--mut)}
.wk .go span{color:var(--acc);font-weight:600}
.days{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.d{position:relative;min-height:64px;padding:8px 0 6px;text-align:center}
.d small{display:block;font-size:.6875rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.d b{display:inline-grid;place-items:center;width:32px;height:32px;margin:2px 0;border-radius:50%;font-size:1.0625rem;font-weight:600}
.d.today b{background:var(--acc);color:var(--af)}
.d i{display:block;width:4px;height:4px;margin:0 auto;border-radius:50%;background:var(--mut)}
.d:not(.has) i{visibility:hidden}
.d[aria-selected=true]{box-shadow:inset 0 -2px 0 var(--fg)}
.d[aria-selected=true] small{color:var(--fg)}

.dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:16px 0 0;font-size:1.0625rem;font-weight:700}
.dh small{font-size:.8125rem;font-weight:400;color:var(--mut)}
.wv .dh{position:sticky;top:0;z-index:1;margin:0;padding:14px 0 6px;background:var(--bg);border-bottom:1px solid var(--line);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.wv .dh.today{color:var(--acc)}
.em{margin:0;padding:34px 0;text-align:center;color:var(--mut)}
.wv .em{padding:14px 0;text-align:left;font-size:.875rem}
.row{position:relative;display:grid;grid-template-columns:50px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.row .t b{display:block;font-size:1.0625rem}
.row .t span{font-size:.8125rem;color:var(--mut)}
.row h3{margin:0;font-size:1rem;font-weight:600;line-height:1.3}
.ty{display:flex;align-items:center;gap:6px;margin-bottom:2px;font-size:.6875rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.ty i{flex:none;width:8px;height:8px;border-radius:2px;background:var(--c,var(--mut))}
.ty em{margin-left:auto;font-style:normal;font-weight:700;text-transform:none;letter-spacing:0;color:var(--acc)}
.row p{margin:3px 0 0;font-size:.875rem;color:var(--mut)}
.row p strong{font-weight:600;color:var(--fg)}
.row.past{opacity:.42}
.row.now::before{content:"";position:absolute;left:-16px;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--acc)}
.row.now .t b{color:var(--acc)}

dialog{width:100%;max-width:560px;margin:auto auto 0;padding:0;border:0;background:none;color:var(--fg);overflow:visible}
dialog::backdrop{background:rgba(0,0,0,.55)}
.sheet{max-height:90vh;overflow:auto;padding:16px 16px max(env(safe-area-inset-bottom),20px);background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mh h2{margin:0;font-size:1.0625rem}
.bt{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;margin:0 6px 6px 0}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.f{margin-bottom:14px}.w{grid-column:1/-1}
.lb,label{display:block;margin-bottom:5px;font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.lb b{color:var(--fg)}
select{width:100%;min-height:44px;padding:0 10px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:44px;height:44px;border:2px solid var(--line);border-radius:10px}
.sw [aria-pressed=true]{border-color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--acc)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="wp" hidden></div>
<div class="page">
  <header class="top">
    <button class="grp" id="gear" aria-haspopup="dialog"><b id="g">Группа</b><span id="gs"></span><span class="sr"> — настройки</span></button>
    <div class="seg" id="vw" role="group" aria-label="Вид расписания">
      <button data-v="day">День</button><button data-v="week">Неделя</button>
    </div>
  </header>
  <div class="st" id="st" role="timer" aria-live="off" hidden>
    <div class="st-r"><span id="sl"></span><b id="sv"></b></div>
    <div class="st-bar" id="sbar" aria-hidden="true"><i id="sb"></i></div>
  </div>
  <div class="sr" id="live" aria-live="polite"></div>
  <p class="nt" id="of" role="status" hidden></p>
  <nav class="wk" aria-label="Неделя">
    <button class="ar" id="prev" aria-label="Предыдущая неделя">‹</button>
    <button class="c" id="wc"><b id="wr"></b><span id="wl"></span></button>
    <button class="ar" id="next" aria-label="Следующая неделя">›</button>
  </nav>
  <div class="days" id="days" role="tablist" aria-label="Дни недели"></div>
  <p class="nt" id="nt" hidden>В данных нет разбивки по неделям — на любой неделе показано одно и то же расписание.</p>
  <main id="list"></main>
</div>

<dialog id="modal" aria-labelledby="mt"><div class="sheet">
  <div class="mh"><h2 id="mt">Настройки</h2><button class="bt" id="close">Готово</button></div>
  <div class="fl" id="fields"></div>
  <div class="f"><span class="lb" id="l1">Подгруппа (лабораторные)</span><div class="seg" id="seg" role="group" aria-labelledby="l1"></div></div>
  <div class="f"><span class="lb" id="l2">Размер текста</span><div class="seg" id="fsz" role="group" aria-labelledby="l2"></div></div>
  <div class="f"><span class="lb" id="l3">Тема: <b id="thn"></b></span><div class="sw" id="sw" role="group" aria-labelledby="l3"></div></div>
  <div class="f"><span class="lb">Обои</span><div id="wb"></div><input type="file" id="wf" accept="image/*" hidden></div>
  <div class="f" id="ab" hidden><span class="lb">Приложение</span><div id="abt"></div></div>
</div></dialog>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const h = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
  const LS = { get(k, d) { try { return localStorage.getItem(k) || d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const cmp = (a, b) => String(a).localeCompare(String(b), "ru", { numeric: true });
  const pad = n => String(n).padStart(2, "0");
  const minsk = () => { const d = new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Minsk" })); return isNaN(d) ? new Date() : d; };  // пары идут по минскому времени

  const DAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
  const FULL = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"];
  const TYPES = { "лек": ["Лекция", "#3b82f6"], "лаб": ["Лаб. работа", "#16a34a"], "пр": ["Практика", "#9333ea"], "практ": ["Практика", "#9333ea"],
                  "сем": ["Семинар", "#ea580c"], "конс": ["Консультация", "#64748b"], "экз": ["Экзамен", "#dc2626"], "зач": ["Зачёт", "#db2777"] };
  const PAIRS = ["08:30", "10:05", "11:35", "13:25", "14:55", "16:35"];   // начала пар → номер пары
  const THEMES = [["auto", "Авто"], ["light", "Светлая"], ["dark", "Тёмная"], ["oled", "OLED Midnight"], ["neon", "Cyberpunk Neon"],
                  ["matcha", "Soft Matcha"], ["matchal", "Matcha Light"], ["titan", "Titanium"]];
  const SW = { auto: ["#f7f6f2", "#121412"], light: ["#f7f6f2", "#2f7a3c"], dark: ["#121412", "#7cc271"], oled: ["#000", "#00ff66"], neon: ["#090914", "#ff2a85"],
               matcha: ["#1e221e", "#8a9a86"], matchal: ["#f4f6f0", "#5f7a5a"], titan: ["#0f1115", "#f59e0b"] };
  const LV = [["faculty", "Факультет", "w"], ["department", "Форма обучения", ""], ["course", "Курс", ""], ["group", "Группа", "w"]];

  const S = {};
  ["faculty", "department", "course", "group", "sub", "theme", "view"].forEach(k => S[k] = LS.get(k, k === "sub" ? "all" : k === "theme" ? "auto" : k === "view" ? "day" : ""));
  const save = () => Object.keys(S).forEach(k => LS.set(k, S[k]));
  let DATA = {}, ALL = [], OPTS = {}, DATA_AT = null, off = 0, WALL = LS.get("wall", ""), DIM = +LS.get("dim", "55"), FS = LS.get("fs", "100"), installEvt = null;
  const today = minsk(), tIdx = (today.getDay() + 6) % 7;
  let day = tIdx;

  /* ---------- даты и недели ---------- */
  const mon = o => new Date(today.getFullYear(), today.getMonth(), today.getDate() - tIdx + o * 7);
  const dateOf = (o, i) => { const m = mon(o); return new Date(m.getFullYear(), m.getMonth(), m.getDate() + i); };
  const keyOf = o => { const d = mon(o); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const fmt = d => d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
  const gen = d => fmt(d).replace(/^\d+\s*/, "");
  const range = (a, b) => a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${gen(b)}` : `${a.getDate()} ${gen(a)} – ${b.getDate()} ${gen(b)}`;
  const entry = () => DATA[S.group] || {};
  const weekOf = o => { const e = entry(); return e.weeks ? e.weeks[keyOf(o)] : e; };   // старый формат данных — без недель
  const hasWeek = o => { const e = entry(); return e.weeks ? !!e.weeks[keyOf(o)] : true; };
  const pl = c => c === 1 ? "пара" : c < 5 ? "пары" : "пар";
  const pr = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 15 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; };
  const left = s => {
    s = Math.max(0, Math.ceil(s));
    const hh = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    const M = x => `${x} ${pr(x, "минута", "минуты", "минут")}`;
    if (hh) return `${hh} ${pr(hh, "час", "часа", "часов")} ${M(m)}`;
    const sec = `${r} ${pr(r, "секунда", "секунды", "секунд")}`;
    return m ? `${M(m)} ${sec}` : sec;
  };
  const inMin = m => m < 60 ? `${m} мин` : `${Math.floor(m / 60)} ч${m % 60 ? " " + m % 60 + " мин" : ""}`;

  /* ---------- занятия ---------- */
  const mins = t => { const m = /(\d{1,2}):(\d{2})/.exec(t || ""); return m ? +m[1] * 60 + +m[2] : null; };
  const initials = t => t.split(/,\s*/).map(x => x.replace(/^((?:[а-яё]+\.\s*)*)([А-ЯЁ][а-яё-]+)\s+([А-ЯЁ])[а-яё]+\s+([А-ЯЁ])[а-яё]+$/, "$1$2 $3.$4.")).join(", ");
  const roomOf = r => /^(ауд|каб)/i.test(r) ? r : "ауд. " + r;
  function parse(l) {   // из строки «лаб. Физика (1 п/гр)» достаём тип, подгруппу и название
    let s = (l.subject || "").trim(), sub = "", type = null;
    const m = s.match(/(\d)\s*п\/гр\.?/i); if (m) { sub = m[1]; s = s.replace(m[0], ""); }
    const t = s.match(/^(лаб|лек|практ|пр|сем|конс|экз|зач)\.\s*(?:зан\.\s*)?/i); if (t) { type = TYPES[t[1].toLowerCase()]; s = s.slice(t[0].length); }
    s = s.replace(/\(\s*\)/g, "").replace(/\s+/g, " ").replace(/^[\s,;.\-–]+|[\s,;.\-–]+$/g, "");
    return { title: s || l.subject || "—", sub, type };
  }
  const lessons = (o, i) => (((weekOf(o) || {})[i]) || []).map(l => {
      const [a, b] = (l.time || "").split(/\s*[-–—]\s*/);
      return { ...l, ...parse(l), a: (a || "").trim(), b: (b || "").trim(), s: mins(a), e: mins(b) };
    }).filter(l => !(l.sub && S.sub !== "all" && l.sub !== S.sub)).sort((x, y) => (x.s ?? 0) - (y.s ?? 0));
  const dayCount = () => lessons(off, 6).length ? 7 : 6;
  const stOf = (l, cur, next) => l.s == null || l.e == null ? "" : cur >= l.e ? "past" : cur >= l.s ? "now" : l.s === next ? "soon" : "";

  function row(l, st, cur) {
    const r = h("article", "row" + (st ? " " + st : ""));
    const t = h("div", "t"); t.append(h("b", "", l.a || "—")); if (l.b) t.append(h("span", "", l.b));
    const ty = h("div", "ty"), sq = h("i"); if (l.type) sq.style.setProperty("--c", l.type[1]);
    ty.append(sq, [l.type ? l.type[0] : "Занятие", l.sub && l.sub + " п/гр"].filter(Boolean).join(" · "));
    if (st === "now") ty.append(h("em", "", "идёт"));
    if (st === "soon") ty.append(h("em", "", "через " + inMin(l.s - cur)));
    const b = h("div"); b.append(ty, h("h3", "", l.title));
    const p = h("p"); if (l.room) p.append(h("strong", "", roomOf(l.room)));
    if (l.teacher) p.append((l.room ? " · " : "") + initials(l.teacher));
    if (p.childNodes.length) b.append(p);
    r.append(t, b); return r;
  }

  /* ---------- экран ---------- */
  function render() {
    tick();
    const n = dayCount(); if (day >= n) day = 0;
    const e = entry();
    $("g").textContent = S.group || "Выбрать группу";
    $("gs").textContent = [S.course && S.course !== "—" && S.course, S.sub !== "all" && S.sub + " п/гр"].filter(Boolean).join(" · ") || "нажмите, чтобы выбрать";
    $("vw").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === S.view));

    const away = off !== 0 || (S.view === "day" && day !== tIdx);
    $("wr").textContent = range(dateOf(off, 0), dateOf(off, n - 1));
    $("wl").textContent = away ? "← вернуться к сегодня" : "эта неделя";
    $("wc").classList.toggle("go", away);
    $("prev").disabled = !hasWeek(off - 1); $("next").disabled = !hasWeek(off + 1);
    $("nt").hidden = off === 0 || !!e.weeks;

    const dt = $("days"); dt.replaceChildren(); dt.hidden = S.view === "week";
    for (let i = 0; i < n; i++) {
      const c = lessons(off, i).length, d = dateOf(off, i);
      const b = h("button", "d" + (c ? " has" : "") + (off === 0 && i === tIdx ? " today" : ""));
      b.type = "button"; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", i === day); b.tabIndex = i === day ? 0 : -1;
      b.setAttribute("aria-label", `${FULL[i]}, ${fmt(d)}: ${c ? c + " " + pl(c) : "занятий нет"}`);
      b.append(h("small", "", DAYS[i]), h("b", "", d.getDate()), h("i"));
      b.onclick = () => { day = i; render(); dt.children[i].focus(); };
      dt.append(b);
    }

    const list = $("list"); list.replaceChildren(); list.className = S.view === "week" ? "wv" : "";
    const nw = minsk(), cur = nw.getHours() * 60 + nw.getMinutes(), t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    (S.view === "week" ? [...Array(n).keys()] : [day]).forEach(i => {
      const ls = lessons(off, i), d = dateOf(off, i), isT = off === 0 && i === tIdx, diff = Math.round((d - t0) / 864e5);
      const hd = h("h2", "dh" + (isT ? " today" : ""), (diff === 0 ? "Сегодня" : diff === 1 ? "Завтра" : diff === -1 ? "Вчера" : FULL[i]) + ", " + fmt(d));
      if (ls.length) hd.append(h("small", "", `${ls.length} ${pl(ls.length)}`));
      list.append(hd);
      if (!ls.length) { list.append(h("p", "em", e.weeks && !weekOf(off) ? "Нет данных за эту неделю" : "Занятий нет")); return; }
      const st = ls.map(x => x.s).filter(m => m != null && m > cur), next = st.length ? Math.min(...st) : null;
      ls.forEach(l => list.append(row(l, isT ? stOf(l, cur, next) : "", cur)));
    });
  }

  /* ---------- плашка «до конца пары» ---------- */
  let lastLabel = "";
  function tick() {
    const box = $("st");
    if (!DATA[S.group]) { box.hidden = true; return; }
    const n = minsk();
    if (n.toDateString() !== today.toDateString()) { location.reload(); return; }   // наступил новый день
    const cur = n.getHours() * 3600 + n.getMinutes() * 60 + n.getSeconds();
    const list = lessons(0, tIdx).filter(l => l.s != null && l.e != null);
    const no = l => { const i = PAIRS.indexOf(l.a.padStart(5, "0")); return i >= 0 ? i + 1 : [...new Set(list.map(x => x.s))].indexOf(l.s) + 1; };
    const going = list.find(l => l.s * 60 <= cur && cur < l.e * 60), next = list.find(l => l.s * 60 > cur);
    let label, value = "", pct = 0;
    if (going) {
      label = `До конца ${no(going)}-й пары`; value = left(going.e * 60 - cur);
      pct = (cur - going.s * 60) / ((going.e - going.s) * 60);
    } else if (next) {
      const prev = list.filter(l => l.e * 60 <= cur).sort((x, y) => y.e - x.e)[0];
      label = prev ? `${next.s - prev.e > 30 ? "Окно" : "Перемена"} · до ${no(next)}-й пары` : `До начала ${no(next)}-й пары`;
      value = left(next.s * 60 - cur);
      pct = prev ? (cur - prev.e * 60) / ((next.s - prev.e) * 60) : 1 - Math.min(next.s * 60 - cur, 3600) / 3600;
    } else label = list.length ? "На сегодня пары закончились" : "Сегодня занятий нет";
    box.hidden = false;
    $("sl").textContent = label; $("sv").textContent = value;
    $("sb").style.width = (Math.min(Math.max(pct, 0), 1) * 100).toFixed(1) + "%";
    $("sbar").hidden = !(going || next);
    if (label !== lastLabel) { lastLabel = label; $("live").textContent = label + (value ? ": " + value : ""); }   // скринридер озвучивает только смену состояния
  }

  /* ---------- настройки ---------- */
  function cascade() {   // как на сайте вуза: форма зависит от факультета, курс — от формы, группа — от курса
    let pool = ALL;
    LV.forEach(([k]) => {
      const o = [...new Set(pool.map(g => g[k]))].sort(cmp);
      if (!o.includes(S[k])) S[k] = o[0];
      OPTS[k] = o; pool = pool.filter(g => g[k] === S[k]);
    });
    save();
  }
  function applyTheme() {
    const ok = THEMES.some(t => t[0] === S.theme);
    document.documentElement.dataset.theme = !ok || S.theme === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : S.theme;
    const m = document.querySelector("meta[name=theme-color]");
    if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  }
  const applyFs = () => { document.documentElement.style.fontSize = FS + "%"; };
  function applyWall() {
    $("wp").style.backgroundImage = WALL ? `url("${WALL}")` : ""; $("wp").hidden = !WALL;
    document.body.classList.toggle("wall", !!WALL);
    document.documentElement.style.setProperty("--dim", DIM / 100);
  }
  function loadWall(file) {   // уменьшаем фото, чтобы оно поместилось в память браузера
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      WALL = c.toDataURL("image/jpeg", 0.72); LS.set("wall", WALL); applyWall(); settings();
    };
    img.src = url;
  }
  const seg = (box, items, cur, on) => {
    box.replaceChildren();
    items.forEach(([v, t]) => { const b = h("button", "", t); b.type = "button"; b.setAttribute("aria-pressed", cur === v); b.onclick = () => on(v); box.append(b); });
  };
  function settings() {
    const box = $("fields"); box.replaceChildren();
    LV.forEach(([k, label, w]) => {
      const o = OPTS[k]; if (!o || (o.length === 1 && o[0] === "—")) return;
      const f = h("div", "f " + w), s = h("select"), lab = h("label", "", label);
      s.id = "f-" + k; lab.htmlFor = s.id; f.append(lab, s);
      o.forEach(v => s.append(new Option(v, v))); s.value = S[k];
      s.onchange = () => { S[k] = s.value; cascade(); settings(); render(); };
      box.append(f);
    });
    seg($("seg"), [["all", "Все"], ["1", "1 п/гр"], ["2", "2 п/гр"]], S.sub, v => { S.sub = v; save(); settings(); render(); });
    seg($("fsz"), [["100", "Aa"], ["115", "Aa+"], ["130", "Aa++"]], FS, v => { FS = v; LS.set("fs", v); applyFs(); settings(); });
    const sw = $("sw"); sw.replaceChildren();
    THEMES.forEach(([v, t]) => {
      const b = h("button"); b.type = "button"; b.title = t; b.setAttribute("aria-label", t); b.setAttribute("aria-pressed", S.theme === v);
      b.style.background = `linear-gradient(135deg,${SW[v][0]} 50%,${SW[v][1]} 50%)`;
      b.onclick = () => { S.theme = v; save(); applyTheme(); settings(); };
      sw.append(b);
    });
    $("thn").textContent = (THEMES.find(t => t[0] === S.theme) || THEMES[0])[1];

    const wb = $("wb"); wb.replaceChildren();
    const pick = h("button", "bt", WALL ? "Сменить фото" : "Фото из галереи"); pick.onclick = () => $("wf").click(); wb.append(pick);
    if (WALL) {
      const rm = h("button", "bt", "Убрать"); rm.onclick = () => { WALL = ""; LS.set("wall", ""); applyWall(); settings(); };
      const rg = h("input"); rg.type = "range"; rg.min = 0; rg.max = 90; rg.value = DIM; rg.setAttribute("aria-label", "Затемнение фона");
      rg.oninput = () => { DIM = +rg.value; LS.set("dim", DIM); applyWall(); };
      wb.append(rm, rg);
    }
    const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone, ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    $("ab").hidden = standalone || !(installEvt || ios);
    const abt = $("abt"); abt.replaceChildren();
    if (installEvt) {
      const b = h("button", "bt", "Установить приложение");
      b.onclick = () => { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; settings(); }); };
      abt.append(b);
    } else if (ios) abt.append("iPhone: «Поделиться» → «На экран Домой»");
  }

  /* ---------- данные, сеть ---------- */
  function setData(d) {
    DATA = d;
    ALL = Object.entries(d).map(([name, e]) => { const m = (e && e._meta) || {}; return { faculty: m.faculty || "—", department: m.department || "—", course: m.course || "—", group: name }; });
    cascade();
  }
  async function load() {
    try { const r = await fetch("schedules.json", { cache: "no-store" }); if (r.ok) { DATA_AT = r.headers.get("date"); return await r.json(); } } catch {}
    return null;
  }
  async function refreshData() { const d = await load(); if (d && Object.keys(d).length) { setData(d); render(); netState(); } }
  function netState() {
    const el = $("of"); el.hidden = navigator.onLine; if (navigator.onLine) return;
    const at = DATA_AT ? new Date(DATA_AT) : null;
    el.textContent = "Нет сети — показаны сохранённые данные" + (at && !isNaN(at) ? " от " + at.toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Minsk" }) : "");
  }
  function step(dir) {   // следующий/предыдущий день, с переходом через границу недели
    let d = day + dir;
    if (d >= dayCount()) { if (!hasWeek(off + 1)) return; off++; d = 0; }
    else if (d < 0) { if (!hasWeek(off - 1)) return; off--; d = dayCount() - 1; }
    day = d; render();
  }

  async function init() {
    applyTheme(); applyWall(); applyFs();
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
    addEventListener("online", netState); addEventListener("offline", netState);
    addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
    const dlg = $("modal");
    $("gear").onclick = () => { settings(); dlg.showModal ? dlg.showModal() : dlg.setAttribute("open", ""); };
    $("close").onclick = () => dlg.close();
    dlg.onclick = e => { if (e.target === dlg) dlg.close(); };
    $("wf").onchange = e => { const f = e.target.files[0]; if (f) loadWall(f); e.target.value = ""; };
    $("vw").onclick = e => { const v = e.target.dataset && e.target.dataset.v; if (v) { S.view = v; save(); render(); } };
    $("prev").onclick = () => { off--; render(); };
    $("next").onclick = () => { off++; render(); };
    $("wc").onclick = () => { off = 0; day = tIdx; render(); };
    $("days").addEventListener("keydown", e => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      step(e.key === "ArrowRight" ? 1 : -1); const b = $("days").children[day]; if (b) b.focus(); e.preventDefault();
    });
    let x0 = null, y0 = 0;   // свайп влево/вправо — соседний день
    $("list").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
    $("list").addEventListener("touchend", e => {
      if (x0 === null || S.view === "week") return;
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
      if (Math.abs(dx) > 60 && Math.abs(dy) < 40) step(dx < 0 ? 1 : -1);
    }, { passive: true });

    const d = await load();
    if (!d || !Object.keys(d).length) { $("gs").textContent = "нет данных"; $("list").append(h("p", "em", d ? "Расписание пока пустое" : "Не удалось загрузить расписание")); return; }
    setData(d); netState();
    if (tIdx === 6 && !lessons(0, 6).length && hasWeek(1)) { off = 1; day = 0; }   // в воскресенье открываем следующую неделю
    render();
    let lastMin = -1;
    setInterval(() => { tick(); const m = minsk().getMinutes(); if (m !== lastMin) { lastMin = m; render(); } }, 1000);   // таймер — раз в секунду, статусы пар — раз в минуту
  }

  if ("serviceWorker" in navigator) {   // офлайн-режим
    navigator.serviceWorker.addEventListener("message", e => { if (e.data === "schedules-updated") refreshData(); });
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
  init();
})();
</script>
</body>
</html>
