<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание МГЭИ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Расписание">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root[data-theme=dark]{--bg:#121212;--card:#1e1e1e;--accent:#3b82f6;--accent2:#10b981;--text:#f3f4f6;--hint:#9ca3af;--border:rgba(255,255,255,.08);--soft:rgba(59,130,246,.12);--soft2:rgba(16,185,129,.12)}
:root[data-theme=light]{--bg:#f4f6fb;--card:#fff;--accent:#2563eb;--accent2:#059669;--text:#111827;--hint:#6b7280;--border:rgba(0,0,0,.08);--soft:rgba(37,99,235,.09);--soft2:rgba(5,150,105,.1)}
:root[data-theme=midnight]{--bg:#030712;--card:#111827;--accent:#8b5cf6;--accent2:#06b6d4;--text:#f9fafb;--hint:#9ca3af;--border:rgba(139,92,246,.15);--soft:rgba(139,92,246,.12);--soft2:rgba(6,182,212,.12)}
:root[data-theme=sunset]{--bg:#180f14;--card:#261821;--accent:#f43f5e;--accent2:#fb923c;--text:#fff1f2;--hint:#fda4af;--border:rgba(244,63,94,.18);--soft:rgba(244,63,94,.12);--soft2:rgba(251,146,60,.12)}
:root[data-theme=emerald]{--bg:#061a14;--card:#0f2920;--accent:#10b981;--accent2:#34d399;--text:#ecfdf5;--hint:#6ee7b7;--border:rgba(16,185,129,.18);--soft:rgba(16,185,129,.12);--soft2:rgba(52,211,153,.12)}
:root[data-theme=cyberpunk]{--bg:#090914;--card:#15152b;--accent:#ff2a85;--accent2:#00ffcc;--text:#f5f0ff;--hint:#a99ed6;--border:rgba(255,42,133,.3);--soft:rgba(255,42,133,.15);--soft2:rgba(0,255,204,.15)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--text);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Display",Roboto,"Segoe UI",sans-serif;
  background:radial-gradient(120% 50% at 50% -10%,var(--soft),transparent 70%),var(--bg);
  padding:max(env(safe-area-inset-top),10px) 14px max(env(safe-area-inset-bottom),20px)}
button,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.logo{width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:21px;background:var(--card);border:1px solid var(--border);border-radius:13px}
.who{flex:1;min-width:0}.who b{display:block;font-size:17px}
.who span{display:block;color:var(--hint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 12px;color:var(--accent);font-weight:700;cursor:pointer}
.week{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:8px;margin-bottom:12px}
.week .ib{padding:10px 16px;font-size:18px}
.wi{flex:1;text-align:center}.wi small{display:block;color:var(--accent);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.wi b{font-size:15px}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:14px}
.days::-webkit-scrollbar{display:none}
.day{flex:1 0 62px;text-align:center;padding:10px 4px;background:var(--card);border:1px solid var(--border);border-radius:14px;cursor:pointer}
.day b{display:block;color:var(--accent);font-size:14px}.day i{display:block;font-style:normal;color:var(--hint);font-size:11px;margin:2px 0 5px}
.day em{font-style:normal;font-size:10px;font-weight:700;color:var(--hint)}
.day.today{border-color:var(--accent2)}
.day.on{background:var(--soft);border-color:var(--accent);box-shadow:0 0 14px var(--soft)}
.les{position:relative;display:flex;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px 14px 14px 18px;margin-bottom:10px;overflow:hidden}
.les::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc,var(--accent2))}
.les.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 22px var(--soft)}
.t{min-width:54px;font-size:16px;font-weight:800;color:var(--tc,var(--accent2))}.t small{display:block;font-size:13px;font-weight:600;color:var(--hint)}
.b{flex:1;min-width:0}.ti{font-weight:700;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:9px;background:var(--soft);color:var(--accent)}.tag.g{background:var(--soft2);color:var(--accent2);background:color-mix(in srgb,var(--tc,var(--accent2)) 16%,transparent);color:var(--tc,var(--accent2))}
.tr{font-size:13px;color:var(--hint)}
.empty{text-align:center;padding:38px 16px;color:var(--hint);background:var(--card);border:1px dashed var(--border);border-radius:18px}
.dh{margin:0 2px 10px}.dh small{display:block;color:var(--accent2);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.dh b{font-size:17px}
.note{margin:0 0 12px;padding:9px 12px;border-radius:12px;background:var(--soft);color:var(--hint);font-size:12px}
.ib.off{opacity:.45}
.ib:disabled{opacity:.3;cursor:default}
.tm{margin-bottom:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--border)}
.tm.live{border-color:var(--accent2);box-shadow:0 0 18px var(--soft2)}
.tm-top{display:flex;flex-direction:column;gap:2px}
.tm-l{font-size:13px;font-weight:700;color:var(--hint)}
.tm-v{font-size:24px;font-weight:800;color:var(--accent2);font-variant-numeric:tabular-nums}
.tm-bar{height:6px;margin-top:9px;border-radius:6px;background:var(--soft);overflow:hidden}
.tm-bar i{display:block;height:100%;width:0;border-radius:6px;background:var(--accent2);transition:width 1s linear}
.tm-s{margin-top:6px;font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-block;margin-bottom:6px;padding:3px 9px;border-radius:9px;font-size:11px;font-weight:800}
.st.now{background:var(--accent);color:var(--bg)}
.st.soon{background:var(--soft);color:var(--accent)}
.st.past,.st.fut{padding-left:0;color:var(--hint);font-weight:700}
.les.past{opacity:.45}
.les.soon{border-color:var(--accent);border-style:dashed}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 2px 10px;font-size:12px;color:var(--hint)}
.lg span::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:var(--tc)}
#wp{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center}
#wp::after{content:"";position:absolute;inset:0;background:rgba(var(--shade,0,0,0),var(--dim,.45))}
:root[data-theme=light]{--shade:255,255,255}
.wall .les,.wall .day,.wall .week,.wall .tm,.wall .empty,.wall .ib,.wall .logo{background:var(--card);background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(6px)}
.wall .day.on{background:var(--soft)}
.wbtn{margin:0 8px 8px 0;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--accent);font-weight:700;cursor:pointer}
.wl{margin:6px 0 2px;font-size:12px;color:var(--hint)}
input[type=range]{width:100%;accent-color:var(--accent)}
.dots{display:flex;justify-content:center;gap:4px;margin-top:6px}
.dots i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(128,128,128,.5)}
.modal{position:fixed;inset:0;z-index:9;display:none;align-items:flex-end;background:rgba(0,0,0,.7);backdrop-filter:blur(8px)}
.modal.open{display:flex}
.sheet{width:100%;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;border-top:1px solid var(--border);padding:18px 16px max(env(safe-area-inset-bottom),28px)}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.mh h2{margin:0;font-size:18px;color:var(--accent)}
.hint{color:var(--hint);font-size:12px;margin:0 0 14px}
.fld{margin-bottom:14px}.fld label{display:block;margin-bottom:6px;font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--accent)}
select{width:100%;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:15px;outline:none}
.seg{display:flex;gap:6px;padding:4px;background:var(--card);border:1px solid var(--border);border-radius:13px}
.seg button{flex:1;padding:10px 4px;border:0;border-radius:10px;background:none;color:var(--hint);font-weight:700;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--bg)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.th{padding:12px 8px;text-align:center;background:var(--card);border:2px solid var(--border);border-radius:14px;font-weight:700;cursor:pointer}
.th.on{border-color:var(--accent)}
</style>
</head>
<body>
<div id="wp" hidden></div>
<header>
  <div class="logo">🌿</div>
  <div class="who"><b>МГЭИ · расписание</b><span id="sub">загрузка…</span></div>
  <button class="ib" id="today">Сегодня</button>
  <button class="ib" id="gear" aria-label="Настройки">⚙️</button>
</header>
<div class="tm" id="tm" hidden>
  <div class="tm-top"><span class="tm-l" id="tmL"></span><span class="tm-v" id="tmV"></span></div>
  <div class="tm-bar"><i id="tmB"></i></div>
  <div class="tm-s" id="tmS"></div>
</div>
<div class="note" id="offline" hidden></div>
<div class="week">
  <button class="ib" id="prev" aria-label="Назад">‹</button>
  <div class="wi"><small id="wl"></small><b id="wd"></b></div>
  <button class="ib" id="next" aria-label="Вперёд">›</button>
</div>
<div class="days" id="days"></div>
<div class="dh"><small id="dl"></small><b id="dd"></b></div>
<div class="note" id="note" hidden>ℹ️ В данных нет разбивки по неделям — на любой неделе показано одно и то же расписание</div>
<div id="list"></div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="mh"><h2>⚙️ Настройки</h2><button class="ib" id="close">✕</button></div>
    <p class="hint">Сохраняются автоматически</p>
    <div id="fields"></div>
    <div class="fld"><label>Подгруппа (лабораторные)</label><div class="seg" id="seg"></div></div>
    <div class="fld" id="appbox" hidden><label>Приложение</label><div id="appbtns"></div></div>
    <div class="fld"><label>Обои</label><div id="wallbox"></div><input type="file" id="wallfile" accept="image/*" hidden></div>
    <div class="fld"><label>Тема оформления</label><div class="themes" id="themes"></div></div>
  </div>
</div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const $ = id => document.getElementById(id);
  const h = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const LS = {
    get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const cmp = (a, b) => String(a).localeCompare(String(b), "ru", { numeric: true });

  const DAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
  const FULL = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"];
  const THEMES = [
    ["dark", "🌙 Dark"],
    ["light", "☀️ Light"],
    ["midnight", "🌌 Midnight"],
    ["sunset", "🌅 Sunset"],
    ["emerald", "🌿 Emerald"],
    ["cyberpunk", "⚡ Cyberpunk"]
  ];
  const SWATCH = {
    dark: ["#121212", "#3b82f6", "#10b981"],
    light: ["#f4f6fb", "#2563eb", "#059669"],
    midnight: ["#030712", "#8b5cf6", "#06b6d4"],
    sunset: ["#180f14", "#f43f5e", "#fb923c"],
    emerald: ["#061a14", "#10b981", "#34d399"],
    cyberpunk: ["#090914", "#ff2a85", "#00ffcc"]
  };
  const TYPES = { "лек": ["📖", "Лекция", "#3b82f6"], "лаб": ["🧪", "Лаб. работа", "#22c55e"],
                  "пр": ["✍️", "Практика", "#a855f7"], "практ": ["✍️", "Практика", "#a855f7"],
                  "сем": ["💬", "Семинар", "#f97316"], "конс": ["🗨️", "Консультация", "#94a3b8"],
                  "экз": ["📝", "Экзамен", "#ef4444"], "зач": ["✅", "Зачёт", "#ec4899"] };

  const S = {};
  ["faculty", "department", "course", "group", "sub", "theme"].forEach(k => S[k] = LS.get(k, k === "sub" ? "all" : k === "theme" ? "dark" : ""));

  let DATA = {}, ALL = [], OPTS = {}, weekOffset = 0, DATA_AT = null;
  const minsk = () => { const d = new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Minsk" })); return isNaN(d) ? new Date() : d; };
  const today = minsk(), todayIdx = (today.getDay() + 6) % 7;
  let day = todayIdx;

  const save = () => Object.keys(S).forEach(k => LS.set(k, S[k]));

  const LEVELS = [["faculty", "Факультет"], ["department", "Форма обучения"], ["course", "Курс"], ["group", "Группа"]];
  function cascade() {
    let pool = ALL;
    LEVELS.forEach(([k]) => {
      const opts = [...new Set(pool.map(g => g[k]))].sort(cmp);
      if (!opts.includes(S[k])) S[k] = opts[0];
      OPTS[k] = opts;
      pool = pool.filter(g => g[k] === S[k]);
    });
    save();
  }

  const pad = n => String(n).padStart(2, "0");
  const keyFor = off => { const d = weekDates(off)[0]; return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const hasWeek = off => { const e = DATA[S.group] || {}; return e.weeks ? !!e.weeks[keyFor(off)] : true; };
  const weekOf = () => { const e = DATA[S.group] || {}; return e.weeks ? e.weeks[keyFor(weekOffset)] : e; };

  function applyTheme() {
    document.documentElement.dataset.theme = S.theme;
    try {
      const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
      const mt = document.querySelector('meta[name=theme-color]'); if (mt) mt.content = bg;
    } catch (e) {}
  }

  function parse(l) {
    let s = (l.subject || "").trim(), sub = null, type = null;
    const m = s.match(/(\d)\s*п\/гр\.?/i);
    if (m) { sub = m[1]; s = s.replace(m[0], ""); }
    const t = s.match(/^(лаб|лек|пр|практ|сем|конс|экз|зач)\.\s*(?:зан\.\s*)?/i);
    if (t) { type = TYPES[t[1].toLowerCase()]; s = s.slice(t[0].length); }
    s = s.replace(/\(\s*\)/g, "").replace(/\s+/g, " ").replace(/^[\s,;.\-–]+|[\s,;.\-–]+$/g, "");
    return { ...l, title: s || l.subject || "—", sub, type };
  }

  const lessonsOf = i => ((weekOf() || {})[i] || []).map(parse)
    .filter(l => !(l.sub && S.sub !== "all" && l.sub !== S.sub));

  const weekDates = off => {
    const mon = new Date(today.getFullYear(), today.getMonth(), today.getDate() - todayIdx + off * 7);
    return DAYS.map((_, i) => new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i));
  };
  const fmt = d => String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0");
  const toMin = t => { const m = (t || "").match(/(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };
  const roomText = r => /^(ауд|каб)/i.test(r) ? r : "ауд. " + r;

  function render() {
    tick();
    const n = lessonsOf(6).length ? 7 : 6;
    if (day >= n) day = 0;
    const dates = weekDates(weekOffset);

    $("wl").textContent = weekOffset === 0 ? "Текущая неделя" : weekOffset === 1 ? "Следующая неделя"
      : weekOffset === -1 ? "Прошлая неделя" : weekOffset > 0 ? `Через ${weekOffset} нед.` : `${-weekOffset} нед. назад`;
    $("wd").textContent = `${fmt(dates[0])} — ${fmt(dates[n - 1])}.${dates[n - 1].getFullYear()}`;
    $("sub").textContent = [S.group, S.course !== "—" && S.course, S.sub !== "all" && S.sub + " п/гр"].filter(Boolean).join(" · ") || "Выбери группу в ⚙️";

    const days = $("days"); days.replaceChildren();
    for (let i = 0; i < n; i++) {
      const c = lessonsOf(i).length;
      const isRealToday = (weekOffset === 0 && i === todayIdx);
      const d = h("div", "day" + (i === day ? " on" : "") + (isRealToday ? " today" : ""));
      d.append(h("b", "", DAYS[i]), h("i", "", fmt(dates[i])), h("em", "", c ? `${c} ${c === 1 ? "пара" : c < 5 ? "пары" : "пар"}` : "—"));
      d.onclick = () => { day = i; render(); };
      days.append(d);
    }

    const picked = dates[day], t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const diff = Math.round((picked - t0) / 864e5);
    $("dl").textContent = diff === 0 ? "Сегодня" : diff === 1 ? "Завтра" : diff === -1 ? "Вчера"
      : diff > 0 ? `Через ${diff} дн.` : `${-diff} дн. назад`;
    $("dd").textContent = `${FULL[day]}, ${fmt(picked)}`;
    $("today").classList.toggle("off", diff === 0);
    $("note").hidden = weekOffset === 0 || !!(DATA[S.group] || {}).weeks;
    $("prev").disabled = !hasWeek(weekOffset - 1);
    $("next").disabled = !hasWeek(weekOffset + 1);

    const list = $("list"); list.replaceChildren();
    const ls = lessonsOf(day);
    if (!ls.length) { list.append(h("div", "empty", weekOf() ? "🎉 В этот день занятий нет" : "Нет данных за эту неделю")); return; }
    const seen = [...new Map(ls.filter(l => l.type).map(l => [l.type[1], l.type])).values()];
    if (seen.length) {
      const lg = h("div", "lg");
      seen.forEach(t => { const i = h("span", "", t[1]); i.style.setProperty("--tc", t[2]); lg.append(i); });
      list.append(lg);
    }
    const live = weekOffset === 0 && day === todayIdx;
    const nw = minsk(), cur = nw.getHours() * 60 + nw.getMinutes();
    const starts = ls.map(x => span(x)[0]).filter(m => m !== null && m > cur);
    const nextStart = starts.length ? Math.min(...starts) : null;
    ls.forEach(l => {
      const [s, e] = span(l);
      let st = "";
      if (live && s !== null && e !== null) st = cur >= e ? "past" : cur >= s ? "now" : s === nextStart ? "soon" : "fut";
      const card = h("div", "les" + (st ? " " + st : ""));
      if (l.type) card.style.setProperty("--tc", l.type[2]);
      const [a, b] = (l.time || "").split(/\s*[-–—]\s*/);
      const t = h("div", "t", a || "—"); if (b) t.append(h("small", "", b));
      const body = h("div", "b");
      if (st) body.append(h("span", "st " + st, st === "soon" ? `⏳ Скоро начнётся · через ${fmtMin(s - cur)}` : ST[st]));
      body.append(h("div", "ti", l.title));
      const tags = h("div", "tags");
      if (l.type) tags.append(h("span", "tag g", l.type[0] + " " + l.type[1]));
      if (l.room) tags.append(h("span", "tag", "📍 " + roomText(l.room)));
      if (l.sub) tags.append(h("span", "tag", `👥 ${l.sub} п/гр`));
      if (tags.children.length) body.append(tags);
      if (l.teacher) body.append(h("div", "tr", "👤 " + l.teacher));
      card.append(t, body); list.append(card);
    });
  }

  const PAIR_STARTS = ["08:30", "10:05", "11:35", "13:25", "14:55", "16:35"];
  const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 15 ? c : k === 1 ? a : k >= 2 && k <= 4 ? b : c; };
  const fmtLeft = s => {
    s = Math.max(0, Math.ceil(s));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    const M = x => `${x} ${plural(x, "минута", "минуты", "минут")}`;
    if (h) return `${h} ${plural(h, "час", "часа", "часов")} ${M(m)}`;
    const sec = `${r} ${plural(r, "секунда", "секунды", "секунд")}`;
    return m ? `${M(m)} ${sec}` : sec;
  };

  function todayLessons() {
    const e = DATA[S.group] || {};
    const wk = e.weeks ? e.weeks[keyFor(0)] : e;
    return ((wk || {})[todayIdx] || []).map(parse)
      .filter(l => !(l.sub && S.sub !== "all" && l.sub !== S.sub))
      .map(l => { const [a, b] = (l.time || "").split(/\s*[-–—]\s*/); return { ...l, a: (a || "").trim(), s: toMin(a), e: toMin(b) }; })
      .filter(l => l.s !== null && l.e !== null)
      .sort((x, y) => x.s - y.s);
  }

  function tick() {
    const box = $("tm");
    if (!S.group || !DATA[S.group]) { box.hidden = true; return; }
    const list = todayLessons();
    const n = minsk(), cur = n.getHours() * 3600 + n.getMinutes() * 60 + n.getSeconds();
    if (n.toDateString() !== today.toDateString()) { location.reload(); return; }
    const no = l => { const i = PAIR_STARTS.indexOf(l.a.padStart(5, "0")); return i >= 0 ? i + 1 : [...new Set(list.map(x => x.s))].indexOf(l.s) + 1; };
    const info = l => [l.title, l.room].filter(Boolean).join(" · ");

    let label, value = "", pct = 0, sub = "", live = false;
    const going = list.find(l => l.s * 60 <= cur && cur < l.e * 60);
    const next = list.find(l => l.s * 60 > cur);
    if (going) {
      live = true;
      label = `До конца ${no(going)}-й пары`;
      value = fmtLeft(going.e * 60 - cur);
      pct = (cur - going.s * 60) / ((going.e - going.s) * 60);
      sub = info(going);
    } else if (next) {
      const prev = list.filter(l => l.e * 60 <= cur).sort((x, y) => y.e - x.e)[0];
      label = prev ? `${next.s - prev.e > 30 ? "Окно" : "Перемена"} · до ${no(next)}-й пары` : `До начала ${no(next)}-й пары`;
      value = fmtLeft(next.s * 60 - cur);
      pct = prev ? (cur - prev.e * 60) / ((next.s - prev.e) * 60) : 1 - Math.min(next.s * 60 - cur, 3600) / 3600;
      sub = "Дальше: " + info(next);
    } else {
      label = list.length ? "✅ На сегодня пары закончились" : "🎉 Сегодня занятий нет";
      pct = list.length ? 1 : 0;
    }
    box.hidden = false;
    box.classList.toggle("live", live);
    $("tmL").textContent = label + (value ? ":" : "");
    $("tmV").textContent = value;
    $("tmS").textContent = sub; $("tmS").hidden = !sub;
    $("tmB").style.width = (Math.min(Math.max(pct, 0), 1) * 100).toFixed(1) + "%";
    box.querySelector(".tm-bar").hidden = !list.length;
  }

  const span = l => { const [a, b] = (l.time || "").split(/\s*[-–—]\s*/); return [toMin(a), toMin(b)]; };
  const fmtMin = m => m < 60 ? `${m} мин` : `${Math.floor(m / 60)} ч${m % 60 ? " " + (m % 60) + " мин" : ""}`;
  const ST = { now: "● Сейчас", past: "Прошло", fut: "Будет" };

  let WALL = LS.get("wall", ""), DIM = +LS.get("dim", "45");
  function applyWall() {
    const w = $("wp");
    w.style.backgroundImage = WALL ? `url("${WALL}")` : "";
    w.hidden = !WALL;
    document.body.classList.toggle("wall", !!WALL);
    document.documentElement.style.setProperty("--dim", DIM / 100);
  }
  function loadWall(file) {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      WALL = c.toDataURL("image/jpeg", 0.72);
      LS.set("wall", WALL);
      applyWall(); renderSettings();
    };
    img.src = url;
  }

  function renderSettings() {
    const box = $("fields"); box.replaceChildren();
    LEVELS.forEach(([k, label]) => {
      const o = OPTS[k];
      if (o.length === 1 && o[0] === "—") return;
      const f = h("div", "fld"), s = h("select");
      f.append(h("label", "", label), s);
      o.forEach(v => s.append(new Option(v, v)));
      s.value = S[k];
      s.onchange = () => { S[k] = s.value; cascade(); renderSettings(); render(); };
      box.append(f);
    });

    const seg = $("seg"); seg.replaceChildren();
    [["all", "Все"], ["1", "1 п/гр"], ["2", "2 п/гр"]].forEach(([v, t]) => {
      const b = h("button", S.sub === v ? "on" : "", t);
      b.onclick = () => { S.sub = v; save(); renderSettings(); render(); };
      seg.append(b);
    });
    const ab = $("appbox"), btns = $("appbtns"); btns.replaceChildren();
    const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    ab.hidden = standalone || !(installEvt || ios);
    if (installEvt) {
      const b = h("button", "wbtn", "📲 Установить приложение");
      b.onclick = () => { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; renderSettings(); }); };
      btns.append(b);
    } else if (ios) btns.append(h("div", "wl", "iPhone: кнопка «Поделиться» → «На экран Домой»"));

    const wb = $("wallbox"); wb.replaceChildren();
    const pick = h("button", "wbtn", WALL ? "📷 Сменить фото" : "📷 Выбрать фото из галереи");
    pick.onclick = () => $("wallfile").click();
    wb.append(pick);
    if (WALL) {
      const rm = h("button", "wbtn", "Сбросить");
      rm.onclick = () => { WALL = ""; LS.set("wall", ""); applyWall(); renderSettings(); };
      const rg = h("input"); rg.type = "range"; rg.min = 0; rg.max = 85; rg.value = DIM;
      rg.oninput = () => { DIM = +rg.value; LS.set("dim", DIM); applyWall(); };
      wb.append(rm, h("div", "wl", "Затемнение фона"), rg);
    }
    const th = $("themes"); th.replaceChildren();
    THEMES.forEach(([v, t]) => {
      const b = h("div", "th" + (S.theme === v ? " on" : ""), t);
      const dots = h("div", "dots");
      (SWATCH[v] || []).forEach(c => { const i = h("i"); i.style.background = c; dots.append(i); });
      b.append(dots);
      b.onclick = () => { S.theme = v; save(); applyTheme(); renderSettings(); };
      th.append(b);
    });
  }

  function setData(d) {
    DATA = d;
    setData(DATA);
    netState();
  }
  async function refreshData() {
    const d = await load();
    if (d && Object.keys(d).length) { setData(d); render(); netState(); }
  }
  function netState() {
    const el = $("offline");
    el.hidden = navigator.onLine;
    if (navigator.onLine) return;
    const at = DATA_AT ? new Date(DATA_AT) : null;
    el.textContent = "📴 Нет сети — показаны сохранённые данные" + (at && !isNaN(at) ? " от " + at.toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Minsk" }) : "");
  }
  addEventListener("online", netState);
  addEventListener("offline", netState);

  let installEvt = null;
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
  addEventListener("appinstalled", () => { installEvt = null; });

  async function load() {
    for (const u of ["schedules.json"]) {
      try { const r = await fetch(u, { cache: "no-store" }); if (r.ok) { DATA_AT = r.headers.get("date"); return await r.json(); } } catch (e) {}
    }
    return null;
  }

  async function init() {
    applyTheme();
    applyWall();
    $("wallfile").onchange = e => { const f = e.target.files[0]; if (f) loadWall(f); e.target.value = ""; };
    $("gear").onclick = () => { renderSettings(); $("modal").classList.add("open"); };
    $("close").onclick = () => $("modal").classList.remove("open");
    $("modal").onclick = e => { if (e.target.id === "modal") $("modal").classList.remove("open"); };
    
    $("prev").onclick = () => { weekOffset--; render(); };
    $("next").onclick = () => { weekOffset++; render(); };
    $("today").onclick = () => { weekOffset = 0; day = todayIdx; render(); };

    DATA = await load();
    if (!DATA || !Object.keys(DATA).length) {
      $("sub").textContent = "нет данных";
      $("list").append(h("div", "empty", DATA ? "Расписание пока пустое" : "⚠️ Не удалось загрузить расписание"));
      return;
    }

    ALL = Object.entries(DATA).map(([name, e]) => {
      const m = (e && e._meta) || {};
      return { faculty: m.faculty || "—", department: m.department || "—", course: m.course || "—", group: name };
    });
    cascade();

    if (todayIdx === 6 && !lessonsOf(6).length && hasWeek(1)) { weekOffset = 1; day = 0; }
    render();
    tick();
    let lastMin = -1;
    setInterval(() => {
      tick();
      const m = minsk().getMinutes();
      if (m !== lastMin) { lastMin = m; render(); }
    }, 1000);
  }
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener("message", e => { if (e.data === "schedules-updated") refreshData(); });
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
  init();
})();
</script>
</body>
</html>
